services:
  gas-cost:
    build: .
    container_name: gas-cost
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3004:3000"
    environment:
      COOKIE_SECURE: "true"
      PUBLIC_ORIGIN: "https://gascost.vilasboas.it"
      EXPECTED_HOST: "gascost.vilasboas.it"
      TRUST_PROXY: "true"
      BOOTSTRAP_TOKEN: "${BOOTSTRAP_TOKEN:-}"
      UV_THREADPOOL_SIZE: "2"
    volumes:
      - gas-cost-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 512m
    cpus: 1.0

volumes:
  gas-cost-data:
