# Trecho de referência. Adapte os nomes das seções ao seu haproxy.cfg existente.

frontend https_frontend
    mode http

    acl host_gascost hdr(host) -i gascost.vilasboas.it
    acl gascost_health path -i /health

    # Não publique o endpoint de saúde pela Internet.
    http-request deny deny_status 404 if host_gascost gascost_health
    use_backend gascost_backend if host_gascost

backend gascost_backend
    mode http

    # Sobrescreve valores enviados pelo cliente; não use add-header neste caso.
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto https

    # Limite adicional para tentativas automatizadas de login.
    stick-table type ip size 100k expire 15m store http_req_rate(1m)
    http-request track-sc0 src if { path -i /api/auth/login }
    http-request deny deny_status 429 if { path -i /api/auth/login } { sc_http_req_rate(0) gt 10 }

# O tráfego deste backend permanece no loopback do próprio host.
    server gascost 127.0.0.1:3004 check
#
# No frontend HTTP da porta 80, redirecione para HTTPS:
# http-request redirect scheme https code 301
#
# No frontend HTTPS, após validar todos os subdomínios, habilite HSTS:
# http-response set-header Strict-Transport-Security "max-age=31536000"
